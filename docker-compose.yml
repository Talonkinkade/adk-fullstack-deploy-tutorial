version: '3.8'

services:
  # Redis - Event bus and caching
  redis:
    image: redis:7-alpine
    container_name: agent-platform-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Neo4j - Context graph database
  neo4j:
    image: neo4j:5.15
    container_name: agent-platform-neo4j
    ports:
      - "7474:7474"  # HTTP
      - "7687:7687"  # Bolt
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    environment:
      - NEO4J_AUTH=neo4j/password
      - NEO4J_ACCEPT_LICENSE_AGREEMENT=yes
      - NEO4J_dbms_memory_pagecache_size=512M
      - NEO4J_dbms_memory_heap_initial__size=512M
      - NEO4J_dbms_memory_heap_max__size=1G
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "password", "RETURN 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 40s

  # Agent Platform (Python backend)
  agent-platform:
    build:
      context: .
      dockerfile: Dockerfile.agent-platform
    container_name: agent-platform
    ports:
      - "8001:8001"  # Agent platform API (different from ADK API on 8000)
    volumes:
      - ./app:/app
      - ./logs:/logs
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=password
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - PYTHONUNBUFFERED=1
    depends_on:
      neo4j:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: python -m app.agent_platform.platform

volumes:
  redis_data:
  neo4j_data:
  neo4j_logs:
